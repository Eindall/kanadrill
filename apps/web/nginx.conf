# Conteneur « web » : sert le build Angular et proxifie /api vers le conteneur « api ».
# Il se place DERRIÈRE le reverse proxy du VPS (TLS, nom de domaine) : le port exposé n'est jamais public.

# IP réelle du visiteur : on fait confiance à X-Forwarded-For uniquement s'il vient d'un réseau privé
# (le reverse proxy du VPS). C'est cette IP que NestJS utilise pour limiter le nombre de requêtes.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Conserve le protocole annoncé par le reverse proxy (https), sinon celui de la connexion.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://kanadrill-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Service worker, sa liste de fichiers et le manifest : JAMAIS en cache, sinon les mises à jour n'arrivent
  # plus (le navigateur garderait l'ancien service worker). À placer avant la règle de cache longue ci-dessous.
  # `expires -1` plutôt qu'`add_header` : un add_header dans un `location` ferait perdre au bloc les en-têtes
  # de sécurité (CSP…) déclarés plus haut.
  location ~ ^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
    expires -1;
    try_files $uri =404;
  }

  # Le manifest : nginx ne connaît pas l'extension .webmanifest et le servirait en application/octet-stream.
  # (`default_type` plutôt que `types { }`, qui effacerait la table des types MIME héritée.)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }

  # Fichiers Angular à nom haché : cache longue durée.
  location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
    expires 1y;
    try_files $uri =404;
  }

  # Application monopage : toute autre URL renvoie index.html (le routeur Angular prend le relais).
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
