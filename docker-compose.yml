services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanadrill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-kanadrill}
    volumes:
      - ${DB_DATA_DIR:-kanadrill-db}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kanadrill}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kanadrill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID manquant dans .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET manquant dans .env}
      DISCORD_REDIRECT_URI: ${APP_URL}/api/auth/discord/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID manquant dans .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET manquant dans .env}
      GOOGLE_REDIRECT_URI: ${APP_URL}/api/auth/google/callback
      EMAIL_HASH_KEY: ${EMAIL_HASH_KEY:?EMAIL_HASH_KEY manquant dans .env}
    networks:
      default:
        aliases: [kanadrill-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases: [kanadrill-web]

volumes:
  kanadrill-db:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK manquant dans .env}