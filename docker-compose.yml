# Production : base PostgreSQL + API NestJS + front Angular (nginx).
# Seul le conteneur « web » est joignable depuis l'hôte, en local (127.0.0.1) : place ton reverse proxy devant.
#
#   cp .env.example .env   # puis remplis les valeurs
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kanadrill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-kanadrill}
    volumes:
      - kanadrill-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kanadrill}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kanadrill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID manquant dans .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET manquant dans .env}
      DISCORD_REDIRECT_URI: ${APP_URL}/api/auth/discord/callback

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

volumes:
  kanadrill-db:
